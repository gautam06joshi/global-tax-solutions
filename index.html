<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding FIRST -->
    <meta charset="UTF-8" />

    <!-- 🔴 CRITICAL: Preload LCP image FIRST (before anything else) -->
    <link rel="preload" as="image" href="/assets/hero-mobile-nCCN_5fK.webp" type="image/webp" />

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- 🔴 CRITICAL: Preconnect to Firebase and other 3rd parties -->
    <link rel="preconnect" href="https://global-tax-solutions.firebaseapp.com" />
    <link rel="preconnect" href="https://www.googleapis.com" />
    <link rel="preconnect" href="https://apis.google.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Google Fonts with display=swap (already good, but remove extra spaces) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- 🔴 CRITICAL: Prevent layout shift with font metrics and space reservation -->
    <style>
      /* Font display swap optimization */
      @font-face {
        font-family: 'Playfair Display';
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter';
        font-display: swap;
      }
      
      /* CRITICAL: Reserve space for hero text to prevent CLS */
      .hero__subtitle,
      .lcp-text {
        min-height: 1.3em;
        line-height: 1.3;
        contain: layout;
      }
      
      /* Prevent flash of invisible text */
      html {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
    </style>

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Professional Tax Consulting Website</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
